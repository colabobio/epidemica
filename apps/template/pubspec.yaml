name: epidemica_template
description: >-
  The reference Epidemica app binary. An institution ships one of these, not one per study: which
  study it runs, and what that study collects, is decided by the protocol bundle it is handed.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  epidemica_core:
    path: ../../packages/epidemica_core
  epidemica_proximity:
    path: ../../packages/epidemica_proximity
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
