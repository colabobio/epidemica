[project]
name = "starsim-epidemica"
version = "0.0.1"
description = "Starsim bridge for Epidemica: measured contact networks and open-cohort enrollment as first-class Starsim modules."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "The Epidemica Project Contributors" }]

dependencies = [
    "starsim>=3.5.2,<4",
    "numpy>=1.26",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starsim_epidemica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
