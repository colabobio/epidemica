// Versions come from the host app's settings.gradle pluginManagement rather than a buildscript
// block here: Flutter is removing support for plugins that apply the Kotlin plugin themselves.
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group = "info.epidemica.proximity"
version = "0.1.0"

android {
    namespace = "info.epidemica.proximity"
    compileSdk = 35

    defaultConfig {
        // Herald supports API 21+. 24 is the floor for the foreground-service behaviour this
        // module relies on, and covers effectively the whole in-service Android population.
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.kotlin.srcDirs += "src/main/kotlin"
        test.kotlin.srcDirs += "src/test/kotlin"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "io.heraldprox:herald:2.2.0"
    implementation "androidx.core:core-ktx:1.13.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "org.json:json:20240303"
}
