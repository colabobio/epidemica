name: epidemica_survey
description: >-
  Scheduled instruments: the definition of what an instrument asks, when a study wants it answered,
  what a response records, and a screen that presents one. Knows nothing about outboxes, tokens or
  a server, so it can be read and tested without them; epidemica_survey_module is what connects it
  to a study.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.29.0"

dependencies:
  crypto: ^3.0.3
  flutter:
    sdk: flutter
  http: ^1.2.0
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
