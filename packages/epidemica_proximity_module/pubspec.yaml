name: epidemica_proximity_module
description: >-
  The proximity module as an Epidemica app capability: wires the proximity sensor to the observation
  outbox, reports its own health, and asks for the permissions it needs. Lives outside
  epidemica_core because core must not depend on any module, and outside the apps because a second
  app would otherwise copy it.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.29.0"

dependencies:
  epidemica_core:
    path: ../epidemica_core
  epidemica_proximity:
    path: ../epidemica_proximity
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
